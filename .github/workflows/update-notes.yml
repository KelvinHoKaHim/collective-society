# .github/workflows/update-notes.yml
name: Update notes from Google Drive

on:
  # Run every hour
  schedule:
    - cron: "0 * * * *"          # every hour at minute 0
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write                 # needed to push the updated notes.html

jobs:
  update-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate notes.html from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python generate_notes.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update notes.html from Google Drive"
          file_pattern: notes.html
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
